services:
  newapi-tools:
    image: newapi-tools:v1.0.0
    container_name: newapi-tools
    restart: always
    environment:
      - POSTGRES_DSN=host=${POSTGRES_HOST} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=${POSTGRES_PORT} sslmode=disable
      - PORT=8080
      - TZ=Asia/Shanghai
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    ports:
      - "${PORT:-8080}:8080"
